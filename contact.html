<!DOCTYPE html>
<html>
<head>
    <title>Contact | Pravin</title>
    <style>
        body {
            background-color: black;
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            text-align: center;
        }
        nav {
            background-color: #EB4221;
            padding: 15px;
        }
        nav a {
            color: white;
            text-decoration: none;
            margin: 20px;
            font-weight: bold;
            letter-spacing: 1px;
        }
        nav a:hover {
            color: #FF4200;
        }
        .container {
            padding: 40px;
            max-width: 900px;
            margin: auto;
        }
        h1 {
            color: #EB4221;
        }
        hr {
            border: 2px solid #FF4200;
            width: 60%;
            margin: 20px auto;
        }
        /* Image gallery styling */
        .img-gallery {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 40px;
        }
        .img-gallery img {
            border: 5px solid #EB4221;
            border-radius: 10px;
            max-width: 250px;
            transition: transform 0.3s ease;
        }
        .img-gallery img:hover {
            transform: scale(1.05);
            border-color: #FF4200;
        }
    </style>
</head>
<body>
    <nav>
        <a href="index.html">Home</a>

        </div>
